{ section: "2. Class Diagrams", title: "Authentication and Data Access (src/core)", desc: "AuthProvider owns the Firebase session and the 'token' cookie. ApolloWrapper builds the GraphQL client (errorLink, authLink, httpLink) and silently refreshes expired tokens once. UserProvider loads the current user and subscription.",
code: `classDiagram
  direction LR
  class AuthProps {
    <<interface>>
    +token: string
    +user: DecodedJwtTokenType
    +isLoading: boolean
    +isAuthenticated: boolean
    +signIn(token, redirectPath)
    +signOut(redirectPath)
    +refreshToken() string
  }
  class AuthProvider {
    <<context provider>>
    -authState
    -currentTokenRef
    -refreshTimerRef
    -TOKEN_REFRESH_INTERVAL: 50 min
    -COOKIE_MAX_AGE: 7 days
    +signIn(token, redirectPath)
    +signOut(redirectPath)
    +refreshToken() string
    -handleAuthStateChange(firebaseUser)
    -setupRefreshTimer()
    -handleSignOut()
  }
  class DecodedJwtTokenType {
    +user_id: string
    +name: string
    +email: string
    +picture: string
    +email_verified: boolean
    +firebase: sign_in_provider, identities
  }
  class ApolloWrapper {
    <<component>>
    +client: ApolloClient
    -errorLink: refresh token and retry once
    -authLink: sets Authorization Bearer
    -httpLink: API_URL/graphql
    -cache: InMemoryCache
    +refetchQueries(include)
  }
  class UserProvider {
    <<context provider>>
    +user: User
    +userSubscription: UserSubscription
    +loading: boolean
    +error
    +refetch()
  }
  class FirebaseAuth {
    <<external SDK>>
    +onAuthStateChanged()
    +getIdToken(user, forceRefresh)
    +signInWithEmailAndPassword()
    +signInWithCustomToken()
    +sendPasswordResetEmail()
    +confirmPasswordReset()
    +signOut()
  }
  class getTokenInfo {
    <<function>>
    +getTokenInfo(token) DecodedJwtTokenType
  }
  class useRequireAuth {
    <<hook>>
    +isAuthenticated: boolean
    +isLoading: boolean
  }
  class useIsAdmin {
    <<hook>>
    -ADMIN_EMAILS: string[]
    +isAdmin: boolean
    +loading: boolean
  }
  class QuizRxGraphQLAPI {
    <<external service>>
    +user
    +findUserSubscription
    +learningAction()
    +submitQuestionFeedback()
    +submitFeedback()
    +getAllUsers / getAllThreads
  }
  AuthProvider ..|> AuthProps
  AuthProvider --> FirebaseAuth : listens, refreshes
  AuthProvider --> getTokenInfo : decodes JWT
  AuthProvider "1" --> "0..1" DecodedJwtTokenType : user
  ApolloWrapper --> AuthProvider : token, refreshToken
  ApolloWrapper --> QuizRxGraphQLAPI : HTTP POST
  UserProvider --> ApolloWrapper : GET_USER, FindUserSubscription
  UserProvider --> AuthProvider : user_id
  useIsAdmin --> AuthProvider : user.email
  useRequireAuth --> AuthProvider`},

{ section: "2. Class Diagrams", title: "Learning Workspace - Session State (extraction-quiz stores)", desc: "The /chat page is driven by three Zustand stores. ExtractionQuizStore keeps one thread per learning experience (Tutor, Practice Studio, Reasoning) so switching modes never loses work. ArchivedSessionsStore keeps up to 50 past sessions. ChainPoolStore is an in-memory cache of authored questions per topic chain.",
code: `classDiagram
  direction LR
  class ExtractionQuizStore {
    <<Zustand store - persisted>>
    +experience: LearningExperience
    +selectedChainId: string
    +modeEntries: ModeEntries
    +entries: ExtractionEntry[]
    +pending: ModePending
    +sessionId: string
    +lastQuestionExperience: QuestionExperience
    +chainProgress: map chainId to index
    +isFetching: boolean
    +error: string
    +setExperience(experience)
    +setSelectedChainId(chainId)
    +setPending(experience, value)
    +appendUserPrompt(content)
    +appendAssistant(content)
    +appendSystem(content, experience)
    +appendAttempt(chainId, question, experience) ExtractionAttempt
    +recordAnswer(attemptId, selectedIndex)
    +recordFreeText(attemptId, freeText)
    +recordReview(attemptId, review)
    +markFeedbackSubmitted(attemptId)
    +resetSession()
    +resetReasoning()
    +loadSession(payload)
  }
  class ExtractionEntry {
    <<union by kind>>
    +id: string
    +kind: user-prompt, attempt, system, assistant
    +content: string
    +createdAt: number
  }
  class ExtractionAttempt {
    +id: string
    +chainId: string
    +selectedIndex: number
    +isCorrect: boolean
    +freeText: string
    +feedbackSubmitted: boolean
    +experience: QuestionExperience
    +createdAt: number
  }
  class ExtractionReview {
    +evaluation: correct, partial, incorrect
    +feedback: string
    +idealAnswer: string
  }
  class ExtractionQuestionData {
    +concept_target: string
    +part2_data: explanation, answer
  }
  class ExtractionQuestion {
    +question: string
    +choices: string[]
    +answer: string
    +option_trap_ids: string[]
    +dp_id: string
    +topic: string
    +sub_topic: string
    +format: mcq or short_answer
    +sequence: number of total
  }
  class ExplanationSection {
    +id: string
    +heading: string
    +body: string
    +options: option, text
  }
  class ArchivedSessionsStore {
    <<Zustand store - persisted>>
    +sessions: ArchivedSession[]
    -ARCHIVE_LIMIT: 50
    +archive(snapshot)
    +remove(sessionId)
    +clear()
  }
  class ArchivedSession {
    +sessionId: string
    +title: string
    +chainId: string
    +modeEntries: ModeEntries
    +experience: LearningExperience
    +archivedAt: number
    +attemptCount: number
  }
  class ChainPoolStore {
    <<Zustand store - in memory>>
    +pools: map chainId to questions
    +loading: map chainId to boolean
    +warmedAt: map chainId to time
    +errors: map chainId to string
    +startLoading(chainId)
    +finishLoading(chainId, pool)
    +failLoading(chainId, error)
  }
  class CalciumBoneChain {
    <<static data - 9 topics>>
    +chainId: string
    +label: string
  }
  class LearningExperience {
    <<enumeration>>
    tutor
    practice_studio
    reasoning
  }
  ExtractionQuizStore "1" *-- "*" ExtractionEntry : one list per experience
  ExtractionEntry "1" o-- "0..1" ExtractionAttempt : kind = attempt
  ExtractionAttempt --> "1" ExtractionQuestionData
  ExtractionAttempt --> "0..1" ExtractionReview
  ExtractionQuestionData *-- "1" ExtractionQuestion
  ExtractionQuestion *-- "*" ExplanationSection
  ArchivedSessionsStore "1" *-- "0..50" ArchivedSession
  ArchivedSession o-- "*" ExtractionEntry
  ChainPoolStore o-- "*" ExtractionQuestionData
  ExtractionAttempt ..> CalciumBoneChain : chainId
  ExtractionQuizStore ..> LearningExperience`},

{ section: "2. Class Diagrams", title: "Admin Panel and Feedback", desc: "The admin panel is three read-only paginated tables. Access is gated client-side by useIsAdmin (email allowlist). The feedback prompt lives in the chat layout and decides when to appear from localStorage state.",

{ section: "3. Sequence Diagrams", title: "Log In with Email and Password", desc: "The login form authenticates against Firebase, then hands the ID token to AuthProvider, which validates it, stores it in a cookie and starts the 50-minute refresh timer.",
code: `sequenceDiagram
  autonumber
  actor U as User
  participant LF as LoginForm
  participant FB as Firebase Auth
  participant AP as AuthProvider
  participant JWT as getTokenInfo
  participant CK as Cookie 'token'
  participant R as Next Router
  U->>LF: Enter email + password, submit
  LF->>FB: signInWithEmailAndPassword(email, password)
  alt credentials valid
    FB-->>LF: UserCredential
    LF->>FB: user.getIdToken()
    FB-->>LF: ID token (JWT)
    LF->>AP: signIn(idToken, "/chat")
    AP->>JWT: decode(idToken)
    JWT-->>AP: DecodedJwtTokenType
    AP->>CK: setCookie(token, maxAge 7 days)
    AP->>AP: authState = authenticated, setupRefreshTimer(50 min)
    AP-->>U: Toast "Signed in successfully"
    AP->>R: push("/chat")
    R->>R: middleware allows /chat, (core) layout renders
  else Firebase error
    FB-->>LF: auth error
    LF-->>U: Error message via useAuthErrorHandler
  end`},

{ section: "3. Sequence Diagrams", title: "Authenticated GraphQL Request with Silent Token Refresh", desc: "Every GraphQL operation passes through errorLink, authLink and httpLink. If the backend reports an expired or invalid token, errorLink refreshes the Firebase ID token and retries the operation once.",
code: `sequenceDiagram
  autonumber
  participant C as Component (useQuery / useMutation)
  participant EL as errorLink
  participant AL as authLink
  participant HL as httpLink
  participant API as QuizRx API
  participant AP as AuthProvider
  participant FB as Firebase Auth
  C->>EL: execute operation
  EL->>AL: forward(operation)
  AL->>AL: Authorization = Bearer (tokenRef or cookie)
  AL->>HL: forward(operation)
  HL->>API: POST /graphql
  API-->>HL: response
  alt success
    HL-->>C: data
  else GraphQL error "token expired / unauthorized / invalid token" and authRetryAttempt = 0
    HL-->>EL: graphQLErrors
    EL->>AP: refreshToken()
    AP->>FB: getIdToken(currentUser, forceRefresh = true)
    FB-->>AP: new ID token
    AP->>AP: update cookie + auth state
    AP-->>EL: new token
    EL->>EL: setContext(Authorization = new token, authRetryAttempt = 1)
    EL->>AL: forward(operation) - single retry
    AL->>HL: forward(operation)
    HL->>API: POST /graphql
    API-->>C: data or final error
  end`},

const PAGE_W = 1047, PAGE_H = 718; // 277mm x 190mm at 96 dpi
const HEAD_H = 70;

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function buildCover(root) {
  const p = el("div", "page cover");
  p.innerHTML = `
    <h1>QuizRx Frontend</h1>
    <div class="sub">UML Documentation of the Whole Application</div>
    <table>
      <tr><td>Repository</td><td>quizrx-frontend</td></tr>
      <tr><td>Stack</td><td>Next.js 15 (App Router), React 19, TypeScript, Apollo Client (GraphQL),<br/>Zustand, Firebase Auth, Tailwind CSS / Radix UI</td></tr>
      <tr><td>Hosting</td><td>Docker image on Google Cloud Run, built by Cloud Build</td></tr>
      <tr><td>Diagrams</td><td>${DIAGRAMS.length} (architecture, class, sequence, state, deployment)</td></tr>
      <tr><td>Generated</td><td>${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</td></tr>
    </table>`;
  root.appendChild(p);

  const t = el("div", "page toc");
  let lastSec = "";
  const items = DIAGRAMS.map((d, i) => {
    const sec = d.section !== lastSec ? `<div class="toc-sec">${d.section}</div>` : "";
    lastSec = d.section;
    return `${sec}<div class="toc-item">${i + 1}. ${d.title} <span class="sec">- page ${i + 3}</span></div>`;
  }).join("");
  t.innerHTML = `<h2>Contents</h2><div class="toc-list">${items}</div>
    <ul class="notes">
      <li>Notation: diagrams are written in Mermaid. Use case, component and deployment views use flowchart syntax with UML conventions (stadium shapes = actors / use cases, dashed arrows = include / dependency).</li>
      <li>Scope: everything reachable from routes allowed by <b>src/middleware.ts</b> is shown in detail. Modules that exist in the code but are not routed (concepts, graph, avatars, cms, subscription, legacy chat) are summarised separately.</li>
      <li>Server-side behaviour (backend API, Firebase) is shown only as seen from the frontend.</li>
    </ul>`;
  root.appendChild(t);
}

function fitSvg(svg, maxW, maxH) {
  const vb = svg.viewBox && svg.viewBox.baseVal;
  if (!vb || !vb.width) return;
  const scale = Math.min(maxW / vb.width, maxH / vb.height, 1.8);
  svg.removeAttribute("style");
  svg.setAttribute("width", Math.floor(vb.width * scale));
  svg.setAttribute("height", Math.floor(vb.height * scale));
}

async function main() {
  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    securityLevel: "loose",
    fontFamily: "Helvetica Neue, Helvetica, Arial, sans-serif",
    themeVariables: {
      primaryColor: "#eaf0ff",
      primaryBorderColor: "#2f5bea",
      primaryTextColor: "#1f2430",
      lineColor: "#4a5263",
      secondaryColor: "#fff4e0",
      tertiaryColor: "#f6f8fc",
      fontSize: "14px",
    },
    flowchart: { htmlLabels: true, curve: "basis", useMaxWidth: false },
    sequence: { useMaxWidth: false, mirrorActors: false, showSequenceNumbers: true },
    class: { useMaxWidth: false },
    state: { useMaxWidth: false },
  });

  const root = document.getElementById("root");
  buildCover(root);

  for (let i = 0; i < DIAGRAMS.length; i++) {
    const d = DIAGRAMS[i];
    const page = el("div", "page");
    const head = el("div", "page-head");
    head.innerHTML = `<div class="section">${d.section}</div><h2>${d.title}</h2><p>${d.desc}</p>`;
    const box = el("div", "diagram");
    page.appendChild(head);
    page.appendChild(box);
    page.appendChild(el("div", "footer", `QuizRx Frontend UML - page ${i + 3}`));
    root.appendChild(page);
    try {
      const { svg } = await mermaid.render(`d${i}`, d.code);
      box.innerHTML = svg;
      const headH = head.getBoundingClientRect().height + 16;
      fitSvg(box.querySelector("svg"), PAGE_W - 8, PAGE_H - headH - 12);
    } catch (err) {
      box.innerHTML = `<pre style="color:#b00020;white-space:pre-wrap">Diagram error: ${String(err && err.message || err)}</pre>`;
      console.error(`Diagram ${i} (${d.title}) failed`, err);
    }
  }
  document.title = "QuizRx Frontend - UML Documentation";
  document.body.setAttribute("data-rendered", "true");
}

main();
</script>
</body>
</html>
